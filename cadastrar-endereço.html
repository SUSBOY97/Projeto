<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Cadastro</title>
    <style>
        /* Base styles for the entire page */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: url('novofundo.png') no-repeat center center/cover;
            color: white;
            min-height: 100vh; 
            display: flex;
            flex-direction: column; 
        }

        header {
            background: #1e3a5f;
            padding: 20px 0;
            text-align: center;
        }

        header h1 {
            margin: 0; 
            color: white;
            font-size: 36px;
        }

        nav {
            margin-top: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #a0c2e9; 
        }
        
        main {
            flex-grow: 1; 
            display: flex;
            justify-content: center; 
            align-items: center; 
            padding: 40px 20px;
        }


        form {
            background-color: rgba(30, 58, 95, 0.85); 
            padding: 30px 40px; 
            border-radius: 12px;
            max-width: 500px; 
            width: 100%;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column; 
        }

        form h2 {
            text-align: center;
            margin-bottom: 25px;
            color: white;
        }

        label {
            color: white;
            margin-bottom: 8px; 
            font-size: 16px;
            font-weight: bold; 
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: calc(100% - 20px); 
            padding: 10px;
            margin-bottom: 18px;
            border: none;
            border-radius: 6px;
            background: #f0f0f0; 
            color: #333;
            font-size: 14px;
            box-sizing: border-box; 
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50; 
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px; 
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        button[type="button"] { 
            background-color: #f44336; 
        }

        button[type="button"]:hover {
            background-color: #d32f2f;
        }

        .rodape {
            background: #1e3a5f;
            color: white;
            padding: 20px 20px;
            text-align: center;
            margin-top: auto; 
        }
    </style>
</head>
<body>
    <header>
        <h1>Futebol Style</h1>
        <nav>
            <a href="Index.html">Home</a>
            <a href="Cadastro.html">Cadastro</a>
            <a href="Login.html">Login</a>
            <a href="SobreNos.html">Quem Somos</a>
        </nav>
    </header>

    <main>
        <form>
            <h2>Cadastro de Endereços</h2>
            <label for="titulo">Título</label>
            <input type="text" name="titulo" id="titulo" />
            
            <label for="CEP">CEP</label>
            <input type="text" name="CEP" id="CEP" />
            
            <label for="endereco">Endereço</label>
            <input type="text" name="endereco" id="endereco" />
            
            <label for="numero">Número</label>
            <input type="text" name="numero" id="numero" />
            
            <label for="complemento">Complemento</label>
            <input type="text" name="complemento" id="complemento" />
            
            <button onclick="cadastrar_endereco(event)">Salvar</button>
            <button type="button" onclick="window.location.href='listagem.html'">Cancelar</button>
        </form>
    </main>

    <div class="rodape">
        <p>&copy; 2025 Futebol Style - Todos os direitos reservados.</p>
    </div>

    <script src="cadastrar-endereço.js"></script>
</body>
</html>
