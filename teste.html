<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: url('novofundo.png') no-repeat center center/cover; /* Make sure novofundo.png is in the correct path */
            color: white;
            min-height: 100vh; /* Ensure body takes full viewport height */
            display: flex;
            flex-direction: column;
        }

        header {
            background: #1e3a5f;
            padding: 20px 0;
            text-align: center;
        }

        header h1 {
            margin: 0;
            color: white;
            font-size: 36px;
        }

        nav {
            margin-top: 10px;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex; /* Use flexbox for horizontal navigation */
            justify-content: center;
        }

        nav li {
            margin: 0 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #a0c2e9; /* Lighter blue on hover */
        }
        
        main {
            flex-grow: 1; /* Allows main to take available space */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        form {
            background-color: rgba(30, 58, 95, 0.85);
            padding: 30px 40px; /* Increased padding */
            border-radius: 12px;
            max-width: 500px; /* Increased max-width for more spacious form */
            width: 100%;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column; /* Arrange labels and inputs vertically */
        }

        form h2 {
            text-align: center;
            margin-bottom: 25px;
            color: white;
        }

        label {
            color: white;
            margin-bottom: 8px; /* Space between label and input */
            font-size: 16px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: calc(100% - 20px); /* Adjust width to account for padding */
            padding: 10px;
            margin-bottom: 18px;
            border: none;
            border-radius: 6px;
            background: #f0f0f0;
            color: #333;
            font-size: 14px;
            box-sizing: border-box; /* Include padding in width calculation */
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50; /* Green for main action */
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px; /* Space above buttons */
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        button[type="button"] { /* Style for the Cancel button */
            background-color: #f44336; /* Red for cancel */
            margin-top: 10px;
        }

        button[type="button"]:hover {
            background-color: #d32f2f;
        }

        .rodape {
            background: #1e3a5f;
            color: white;
            padding: 20px 20px;
            text-align: center;
            margin-top: auto; /* Pushes footer to the bottom */
        }
    </style>
</head>
<body>
    <header>
        <h1>Cadastro de Endereços</h1>
        <nav>
            <ul>
                <li><a href="../pagina_inicial/index.html">Home</a></li>
                <li><a href="../pagina_inicial/sobre_nos.html">Sobre Nós</a></li>
                <li><a href="../cadastro_usuario/tela_cadastro.html">Cadastro</a></li>
                <li><a href="../login/login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <form>
            <h2>Preencha seus dados</h2>
            <label for="titulo">Título</label>
            <input type="text" name="titulo" id="titulo" />
            
            <label for="CEP">CEP</label>
            <input type="text" name="CEP" id="CEP" />
            
            <label for="endereco">Endereço</label>
            <input type="text" name="endereco" id="endereco" />
            
            <label for="numero">Número</label>
            <input type="text" name="numero" id="numero" />
            
            <label for="complemento">Complemento</label>
            <input type="text" name="complemento" id="complemento" />
            
            <button onclick="cadastro_endereco(event)">Salvar</button>
            <button type="button" onclick="window.location.href='listagem_enderecos.html'">Cancelar</button>
        </form>
    </main>

    <div class="rodape">
        <p>&copy; 2025 Futebol Style - Todos os direitos reservados.</p>
    </div>

    <script src="cadastrar_endereco.js"></script>
</body>
</html>
